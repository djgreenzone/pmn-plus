<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="Polynesian Music Network. Bringing you inside access to the Pacific. Coming soon.">

<link rel="canonical" href="https://www.polynesianmusicnetwork.com/">

<meta property="og:title" content="PMN+ — Coming soon">
<meta property="og:description" content="Polynesian Music Network. Bringing you inside access to the Pacific.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.polynesianmusicnetwork.com/">
<meta property="og:image" content="https://www.polynesianmusicnetwork.com/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="PMN+ — Coming soon">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://www.polynesianmusicnetwork.com/assets/og.png">
<meta name="theme-color" content="#000000">

<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<script type="application/ld+json">
{"@context":"https://schema.org","@type":"Organization","name":"Polynesian Music Network","alternateName":"PMN+","url":"https://www.polynesianmusicnetwork.com/","logo":"https://www.polynesianmusicnetwork.com/assets/pmn-logo.png","description":"Sport, sound and story from across the Pacific."}
</script>

<style>
:root{
  --bg:#000;
  --ink:#fff;
  --dim:#8A8A8E;
  --line:#242426;
  --font:'Instrument Sans',system-ui,-apple-system,sans-serif;
  --display:'Bebas Neue','Instrument Sans',system-ui,sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}

body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font);
  line-height:1.55;
  min-height:100svh;
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
}

.bg{
  position:fixed;
  inset:0;
  z-index:0;
  overflow:hidden;
  background:#000;
}
.bg video{
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:.45;
}
.bg::after{
  content:'';
  position:absolute;
  inset:0;
  background:
    radial-gradient(80% 60% at 50% 45%,rgba(0,0,0,.3) 0%,rgba(0,0,0,.78) 100%),
    linear-gradient(180deg,rgba(0,0,0,.55) 0%,transparent 25%,transparent 60%,rgba(0,0,0,.8) 100%);
}

/* Video plays on mobile too. Reduced-motion users still get plain black. */
@media (prefers-reduced-motion:reduce){
  .bg video{display:none}
}

.stage{
  position:relative;
  z-index:1;
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:clamp(2rem,6vw,3.5rem) clamp(1.5rem,5vw,2.5rem);
  gap:clamp(1.5rem,3.5vw,2rem);
}

.logo{width:clamp(140px,24vw,250px);height:auto;display:block}

.eyebrow{
  font-family:var(--display);
  font-size:clamp(1rem,2.6vw,1.5rem);
  font-weight:400;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--dim);
  margin-bottom:-.5rem;
}

h1.status{
  font-family:var(--display);
  font-size:clamp(3.5rem,13vw,8.5rem);
  font-weight:400;
  line-height:.85;
  letter-spacing:.02em;
  text-transform:uppercase;
  color:var(--ink);
}

.line{
  max-width:30ch;
  color:var(--dim);
  font-size:clamp(1.0625rem,1rem + .35vw,1.25rem);
  text-wrap:balance;
}

.capture{width:100%;max-width:25rem;margin-top:.25rem;position:relative;z-index:1}
form{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
input[type=email]{
  flex:1 1 12rem;min-width:0;font:inherit;color:#fff;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.18);
  border-radius:999px;padding:.85rem 1.35rem;
  backdrop-filter:blur(6px);
  transition:border-color .15s,background .15s;
}
input[type=email]::placeholder{color:#6E6E73}
input[type=email]:hover{border-color:rgba(255,255,255,.32)}
input[type=email]:focus{outline:2px solid #fff;outline-offset:2px;border-color:transparent;background:rgba(255,255,255,.1)}
button{
  font-family:var(--display);font-size:1.15rem;letter-spacing:.08em;text-transform:uppercase;
  color:#000;background:#fff;border:0;border-radius:999px;padding:.85rem 1.9rem;
  cursor:pointer;transition:opacity .15s,transform .1s;
}
button:hover{opacity:.86}
button:active{transform:translateY(1px)}
button:focus-visible{outline:2px solid #fff;outline-offset:3px}
button[disabled]{opacity:.5;cursor:default}
.fine{margin-top:.75rem;font-size:.8125rem;color:#5E5E63}
.note{margin-top:.7rem;font-size:.9375rem;min-height:1.35em}
.note.ok{color:#fff}
.note.bad{color:#FF6B5E}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:460px){input[type=email],button{flex:1 1 100%}}

.success{
  display:none;
  flex-direction:column;align-items:center;gap:.85rem;
  padding:2.25rem 2rem 2rem;
  width:100%;max-width:23rem;margin:0 auto;
  text-align:center;
  background:rgba(255,255,255,.055);
  backdrop-filter:blur(22px) saturate(140%);
  -webkit-backdrop-filter:blur(22px) saturate(140%);
  border:1px solid rgba(61,220,132,.55);
  border-radius:24px;
  box-shadow:0 0 0 1px rgba(61,220,132,.12),
             0 0 42px -8px rgba(61,220,132,.30),
             inset 0 1px 0 rgba(255,255,255,.10);
  animation:pop .45s cubic-bezier(.2,.8,.3,1) both;
}
.success.on{display:flex}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.success{animation:none}}

.success .tick{
  width:38px;height:38px;border-radius:50%;
  border:1.5px solid #3DDC84;
  display:grid;place-items:center;
  color:#3DDC84;font-size:1.05rem;line-height:1;
  background:rgba(61,220,132,.10);
}
.success .big{font-family:var(--display);font-size:2.9rem;line-height:.9;letter-spacing:.02em;text-transform:uppercase;color:#fff}
.success .sub{font-size:1.05rem;color:var(--dim);max-width:none}
.success .sub b{color:#fff;font-weight:500}
.success .mark{width:82px;height:auto;opacity:.55;margin-top:.35rem}

.foot{
  position:relative;
  z-index:1;
  width:100%;
  padding:1.25rem clamp(1.5rem,5vw,2.5rem) 1.75rem;
  display:flex;
  justify-content:center;
  gap:.5rem 1.5rem;
  flex-wrap:wrap;
  font-size:.8125rem;
  color:#5E5E63;
}
.foot a{color:var(--dim);text-decoration:none;border-bottom:1px solid var(--line)}
.foot a:hover{color:var(--ink);border-color:#4A4A4E}
</style>
</head>
<body>

<div class="bg">
  <video autoplay muted loop playsinline preload="metadata" aria-hidden="true">
    <source src="assets/bg.mp4" type="video/mp4">
  </video>
</div>

<main class="stage">
  <img class="logo" src="assets/pmn-logo.png" alt="PMN+ — Polynesian Music Network">
  <p class="eyebrow">A new PMN+ digital project</p>
  <h1 class="status">Coming soon</h1>
  <p class="line">Bringing you inside access to the Pacific.</p>

  <div class="capture">
    <form id="f" novalidate>
      <label for="email" class="sr">Email address</label>
      <input id="email" type="email" name="email" placeholder="you@email.com" autocomplete="email" required>
      <button type="submit" id="btn">I’m in</button>
    </form>
    <p class="fine">Exclusive PMN+ drops, interviews, stories and first access giveaways.</p>
    <p class="note" id="note" role="status" aria-live="polite"></p>

    <div class="success" id="success" role="status" aria-live="polite">
      <div class="tick">&#10003;</div>
      <p class="big">You&rsquo;re in!</p>
      <p class="sub">Welcome to the <b>aiga</b>.</p>
      <img class="mark" src="assets/pmn-logo.png" alt="PMN+">
    </div>
  </div>
</main>

<footer class="foot">
  <span>&copy; <span id="yr"></span> Polynesian Music Network</span>
</footer>

<script>
document.getElementById('yr').textContent = new Date().getFullYear();

const KLAVIYO_COMPANY_ID = 'T9JJzp';
const KLAVIYO_LIST_ID    = 'SLSsGL';

const form = document.getElementById('f');
const email = document.getElementById('email');
const btn = document.getElementById('btn');
const note = document.getElementById('note');
const say = (m,k) => { note.textContent = m; note.className = 'note ' + (k||''); };

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const v = email.value.trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) {
    say('That email address doesn\u2019t look right.','bad'); email.focus(); return;
  }
  btn.disabled = true;
  const label = btn.textContent;
  btn.textContent = 'Adding\u2026';

  const payload = { data: { type:'subscription',
    attributes:{ profile:{ data:{ type:'profile', attributes:{ email:v } } } },
    relationships:{ list:{ data:{ type:'list', id:KLAVIYO_LIST_ID } } } } };

  try {
    const res = await fetch('https://a.klaviyo.com/client/subscriptions/?company_id=' + KLAVIYO_COMPANY_ID, {
      method:'POST',
      headers:{ 'content-type':'application/json', 'revision':'2026-07-15' },
      body: JSON.stringify(payload)
    });
    if (res.status === 202 || res.ok) {
      form.style.display='none';
      document.querySelector('.fine').style.display='none';
      note.textContent='';
      document.getElementById('success').classList.add('on');
    } else {
      console.error('Klaviyo', res.status, await res.text());
      throw new Error(res.status);
    }
  } catch (err) {
    console.error(err);
    say('That didn\u2019t save. Try again in a moment.','bad');
    btn.disabled=false; btn.textContent=label;
  }
});
</script>
</body>
</html>
