<!-- Supabase → Authentication → Emails → paste into BOTH "Magic link" and "Confirm signup". Subject: Your PMN+ sign-in code: {{ .Token }} -->
<div style="background:#000;padding:40px 16px;font-family:Helvetica,Arial,sans-serif;color:#fff">
  <div style="max-width:440px;margin:0 auto;background:#0d0e12;border:1px solid #242426;border-radius:18px;padding:36px 28px;text-align:center">
    <img src="https://www.polynesianmusicnetwork.com/assets/apple-touch-icon.png" width="56" height="56" alt="PMN+" style="border-radius:50%;margin:0 auto 20px;display:block">
    <h1 style="margin:0 0 8px;font-size:26px;letter-spacing:1px;text-transform:uppercase">Your sign-in code</h1>
    <p style="margin:0 0 24px;color:#b9b9be;font-size:15px;line-height:1.5">Enter this code on the PMN+ account page. It expires in 1 hour.</p>
    <div style="font-size:36px;font-weight:700;letter-spacing:10px;padding:16px 0;border:1.5px dashed rgba(255,255,255,.4);border-radius:12px;margin:0 0 24px">{{ .Token }}</div>
    <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#C8102E;color:#fff;text-decoration:none;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:14px 28px;border-radius:999px;font-size:14px">Or tap to sign in</a>
    <p style="margin:24px 0 0;color:#8A8A8E;font-size:12px;line-height:1.5">Didn&rsquo;t ask for this? You can ignore this email.<br>PMN+ &middot; polynesianmusicnetwork.com</p>
  </div>
</div>
